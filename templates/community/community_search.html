{% extends "layout.html" %}

{% block title %}
Community Search
{% endblock %}

{% block main %}

<section class="community-search-page">

    <div class="search-container">

        <h1>Find Your Community</h1>

        <p>
            Join thousands of students learning together.
            Search for your course below.
        </p>

        <div class="search-box">

            <button id="searchBtn" type="button" class="search-button">
                <i class="bi bi-search"></i>
            </button>

            <input
                id="communitySearch"
                type="text"
                placeholder="Search for a community..."
                autocomplete="off">

            <div id="searchResults" class="search-dropdown"></div>

        </div>

    </div>

</section>

<script>
const input = document.getElementById("communitySearch");
const dropdown = document.getElementById("searchResults");
const searchBtn = document.getElementById("searchBtn");

let currentResults = [];

// ----------------------
// Search Function
// ----------------------
async function searchCommunities() {

    const query = input.value.trim();

    if (query === "") {
        dropdown.innerHTML = "";
        dropdown.style.display = "none";
        currentResults = [];
        return;
    }

    try {

        const response = await fetch(
            `/api/community/search?q=${encodeURIComponent(query)}`
        );

        const communities = await response.json();

        currentResults = communities;

        dropdown.innerHTML = "";

        // ----------------------
        // No Results
        // ----------------------

        if (communities.length === 0) {

            dropdown.innerHTML = `
                <div class="search-empty">

                    <div class="empty-icon">
                        <i class="bi bi-search"></i>
                    </div>

                    <h3>No community found</h3>

                    <p>
                        We couldn't find
                        <strong>"${query}"</strong>.
                    </p>

                    <p class="small-text">
                        Be the first student to create it.
                    </p>

                    <a href="/create-community"
                       class="btn btn-primary mt-3">

                        <i class="bi bi-plus-circle me-2"></i>

                        Create Community

                    </a>

                </div>
            `;

            dropdown.style.display = "block";
            return;
        }

        // ----------------------
        // Results
        // ----------------------

        communities.forEach(c => {

        dropdown.innerHTML += `

            <div class="search-result-card">

                <div class="search-result-info">

                    <div class="search-title">
                        ${c.name}
                    </div>

                    <div class="search-meta">
                        ${c.category} • ${c.members} members
                    </div>

                    <div class="search-description">
                        ${c.description}
                    </div>

                </div>

                <div class="search-actions">

                    ${
                        c.joined
                        ?
                        `<a href="/community/${c.id}"
                            class="btn btn-outline-light">
                            Open
                        </a>`
                        :
                        `<a href="/join-community/${c.id}"
                            class="btn btn-primary">
                            Join Community
                        </a>`
                    }

                </div>

            </div>

        `;
    });

        dropdown.style.display = "block";

    } catch (err) {

        console.error(err);

    }
}

// ----------------------
// Typing
// ----------------------

input.addEventListener("input", searchCommunities);

// ----------------------
// Press Enter
// ----------------------

input.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        const first = dropdown.querySelector(".search-result-card");

        if(first){

            window.location.href = first.href;

        }else{

            window.location.href = "/create-community";

        }

    }

    // Escape closes dropdown

    if(e.key === "Escape"){

        dropdown.style.display = "none";

    }

});

// ----------------------
// Search Button
// ----------------------

searchBtn.addEventListener("click", function(){

    const first = dropdown.querySelector(".search-result-card");

    if(first){

        window.location.href = first.href;

    }else{

        searchCommunities();

    }

});

// ----------------------
// Click Outside
// ----------------------

document.addEventListener("click", function(e){

    if(
        !input.contains(e.target) &&
        !dropdown.contains(e.target) &&
        !searchBtn.contains(e.target)
    ){

        dropdown.style.display = "none";

    }

});

// ----------------------
// Focus Input
// ----------------------

input.addEventListener("focus", function(){

    if(currentResults.length > 0){

        dropdown.style.display = "block";

    }

});
</script>

{% endblock %}
