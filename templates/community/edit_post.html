{% extends "layout.html" %}

{% block title %}
Edit Post
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/post/create_post.css') }}">
{% endblock %}

{% block main %}

<section class="create-post-page">

    <div class="post-card">

        <div class="post-header">

            <img
                src="{% if user["profile_image"] and user["profile_image"] != 'default-profile.jpg' %}
                        {{ url_for('static', filename='uploads/' ~ user["profile_image']) }}
                    {% else %}
                        {{ url_for('static', filename='images/default-profile.jpg') }}
                    {% endif %}"
                class="post-avatar">

            <div>

                <h4>Edit your post</h4>

                <small class="text-muted">
                    Update your post and save the changes.
                </small>

            </div>

        </div>

        <form
            action="{{ url_for('post.edit_post', community_id=community_id, post_id=post['id']) }}"
            method="post">

            <!-- Title -->
            <div class="mb-4">

                <label class="form-label">
                    Title
                </label>

                <input
                    autofocus
                    class="form-control post-title"
                    name="title"
                    type="text"
                    value="{{ post['title'] }}"
                    maxlength="100"
                    required>

            </div>

            <!-- Content -->
            <div class="mb-4">

                <label class="form-label">
                    What's on your mind?
                </label>

                <textarea
                    class="form-control post-content"
                    name="content"
                    rows="8"
                    maxlength="5000"
                    required>{{ post['content'] }}</textarea>

            </div>

            <!-- Tag -->
            <div class="mb-4">

                <label class="form-label">
                    Category
                </label>

                <select
                    class="form-select"
                    name="tag"
                    required>

                    <option value="Question"
                        {% if post['tag']=="Question" %}selected{% endif %}>
                        ❓ Question
                    </option>

                    <option value="Discussion"
                        {% if post['tag']=="Discussion" %}selected{% endif %}>
                        💬 Discussion
                    </option>

                    <option value="Resource"
                        {% if post['tag']=="Resource" %}selected{% endif %}>
                        📚 Resource
                    </option>

                    <option value="Notes"
                        {% if post['tag']=="Notes" %}selected{% endif %}>
                        📝 Notes
                    </option>

                    <option value="Project"
                        {% if post['tag']=="Project" %}selected{% endif %}>
                        💻 Project
                    </option>

                </select>

            </div>

            <div class="post-buttons">

                <a
                    href="{{ url_for('community.community', community_id=community_id) }}"
                    class="btn btn-outline-secondary">

                    Cancel

                </a>

                <button
                    class="btn btn-primary"
                    type="submit">

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
