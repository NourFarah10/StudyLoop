{% extends "layout.html" %}

{% block title %}
    Create Post
{% endblock %}

{% block main %}

<section class="create-post">
    <div class="post-card">
        <h1>Create a Post</h1>
        <p>
            Share a question, resource, or start a discussion with your community.
        </p>
        <form action="{{ url_for('create_post') }}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label">
                    Title
                </label>
                <input
                    class="form-control"
                    id="title"
                    name="title"
                    type="text"
                    placeholder="Enter a title"
                    maxlength="100"
                    required>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">
                    Content
                </label>
                <textarea
                    class="form-control"
                    id="content"
                    name="content"
                    rows="8"
                    placeholder="Write your post here..."
                    maxlength="5000"
                    required></textarea>
            </div>

            <div class="mb-3">
                <label for="tag" class="form-label">
                    Tag
                </label>
                <select
                    class="form-select"
                    id="tag"
                    name="tag">
                    <option value="">Select a tag</option>
                    <option value="Question">Question</option>
                    <option value="Discussion">Discussion</option>
                    <option value="Resource">Resource</option>
                    <option value="Notes">Notes</option>
                    <option value="Project">Project</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a
                    href="{{ url_for('communities') }}"
                    class="btn btn-outline-secondary">
                    Cancel
                </a>
                <button
                    class="btn btn-primary"
                    type="submit">
                    Publish Post
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
