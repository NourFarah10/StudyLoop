{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
    <section class="leftPart">
        <div>
            <h1>Welcome Back</h1>
            <p>Continue learning with your course community.</p>
        </div>
    </section>

    <section class="rightPart">
        <div class="login-card">
            <h2>Log In</h2>
            <p>Welcome back to StudyLoop.</p>

            <form class="login-form" action="{{ url_for('login') }}" method="post">

                <div class="mb-3">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        class="form-control"
                        name="username"
                        type="text"
                        placeholder="Username"
                        autocomplete="username"
                        maxlength="50"
                        required
                        autofocus>
                </div>

                <div class="mb-3">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        class="form-control"
                        name="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        maxlength="50"
                        required>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Log In
                </button>

            </form>

            <p class="mt-3 text-center">
                Don't have an account?
                <a href="{{ url_for('signup') }}">Sign Up</a>
            </p>

        </div>
    </section>
{% endblock %}
