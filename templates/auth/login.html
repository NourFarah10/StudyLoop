{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
<div class="auth-shell">

    <section class="leftPart">
        <div>
            <h1>Welcome Back</h1>
            <p>Continue learning with your course community</p>
        </div>
    </section>

    <section class="rightPart">
        <div class="login-card">
            <h2>Log In</h2>
            <p>    Log in to continue learning with your communities</p>

            <form class="login-form" action="{{ url_for('auth.login') }}" method="post">

                <div class="mb-3">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        class="form-control"
                        name="username"
                        type="text"
                        placeholder="Username"
                        autocomplete="username"
                        maxlength="50"
                        required
                        autofocus>
                </div>

                <div class="mb-3">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            id="password"
                            class="form-control"
                            name="password"
                            type="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            maxlength="50"
                            required>
                        <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="text-end mb-3">
                    <a href="{{ url_for('auth.forget_password') }}">
                        Forgot Password?
                    </a>
                </div>
                
                <button class="btn btn-primary w-100" type="submit">
                    Log In
                </button>

            </form>

            <p class="mt-3 text-center">
                Don't have an account?
                <a href="{{ url_for('auth.signup') }}">Sign Up</a>
            </p>

        </div>
    </section>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
