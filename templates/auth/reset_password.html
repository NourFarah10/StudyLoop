{% extends "layout.html" %}

{% block title %}
    Reset Password
{% endblock %}

{% block main %}
<div class="auth-shell">

    <section class="leftPart">
        <div>
            <h1>Create a New Password</h1>
            <p>
                Choose a new password for your StudyLoop account.
            </p>
        </div>
    </section>

    <section class="rightPart">

        <div class="auth-card">

            <h2>Reset Password</h2>

            <form
                action="{{ url_for('auth.reset_password', token=token) }}"
                method="POST"
                class="auth-form">

                <div class="mb-3">
                    <label for="password">New Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required
                        minlength="6">
                </div>

                <div class="mb-3">
                    <label for="confirmation">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmation"
                        name="confirmation"
                        class="form-control"
                        required
                        minlength="6">
                </div>

                <button
                    class="btn btn-primary w-100"
                    type="submit">

                    Reset Password

                </button>

            </form>

        </div>

    </section>

</div>
{% endblock %}
