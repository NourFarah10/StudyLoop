{% extends "layout.html" %}

{% block title %}
    Signup
{% endblock %}

{% block main %}
<div class="auth-shell">

    <section class="leftPart">
        <div>
            <h1>Learn Together</h1>
            <p>Connect with students taking the same course.</p>
        </div>
    </section>
    <section class="rightPart">
        <div class="signup-card">
            <h2>Create Account</h2>
            <p>Join StudyLoop today.</p>
            <form class="signup-form" action="{{ url_for('auth.signup') }}" method="post">
                <div class="mb-3">
                    <label for="fullname">Full Name</label>
                    <input
                    autofocus
                    class="form-control"
                    id="fullname"
                    name="fullname"
                    placeholder="Full Name"
                    type="text"
                    autocomplete="name"
                    required
                    maxlength="50"
                >
                </div>
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Username"
                    type="text"
                    autocomplete="username"
                    required
                    maxlength="50"
                >
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Email"
                        type="email"
                        autocomplete="email"
                        required
                        maxlength="50"
                    >
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input 
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Password"
                            type="password"
                            autocomplete="new-password"
                            required
                            maxlength="50"
                            minlength="8"
                            aria-describedby="passwordHelp"
                        >
                        <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="passwordHelp" class="form-text">
                        Use at least 8 characters, including letters and numbers.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmation">Confirm Password</label>
                    <div class="password-wrapper">
                        <input 
                            class="form-control"
                            id="confirmation"
                            name="confirmation"
                            placeholder="Confirm Password"
                            type="password"
                            autocomplete="new-password"
                            required
                            maxlength="50"
                            minlength="8"
                        >
                        <button type="button" class="toggle-password" aria-label="Show password" data-target="confirmation">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Create Account</button>
            </form>
            <p class="mt-3 text-center">
                Already have an account?
                <a href="{{ url_for('auth.login') }}">Log in</a>
            </p>
        </div>
    </section>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
