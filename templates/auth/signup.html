{% extends "layout.html" %}

{% block title %}
    Signup
{% endblock %}

{% block main %}
    <section class="leftPart">
        <div>
            <h1>Learn Together</h1>
            <p>Connect with students taking the same course.</p>
        </div>
    </section>
    <section class="rightPart">
        <div class="signup-card">
            <h2>Create Account</h2>
            <p>Join StudyLoop today.</p>
            <form class="signup-form" action="{{ url_for('signup') }}" method="post">
                <div class="mb-3">
                    <label for="fullname">Full Name</label>
                    <input
                    autofocus
                    class="form-control"
                    id="fullname"
                    name="fullname"
                    placeholder="Full Name"
                    type="text"
                    autocomplete="name"
                    required
                    maxlength="50"
                >
                </div>
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Username"
                    type="text"
                    autocomplete="username"
                    required
                    maxlength="50"
                >
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Email"
                        type="email"
                        autocomplete="email"
                        required
                        maxlength="50"
                    >
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <input 
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Password"
                        type="password"
                        autocomplete="new-password"
                        required
                        maxlength="50"
                        minlength="8"
                        aria-describedby="passwordHelp"
                    >
                    <small id="passwordHelp" class="text-muted">
                        Use at least 8 characters.
                    </small>
                </div>
                <div class="mb-3">
                    <label for="confirmation">Confirm Password</label>
                    <input 
                        class="form-control"
                        id="confirmation"
                        name="confirmation"
                        placeholder="Confirm Password"
                        type="password"
                        autocomplete="new-password"
                        required
                        maxlength="50"
                        minlength="8"
                    >
                </div>
                <button class="btn btn-primary w-100" type="submit">Create Account</button>
            </form>
            <p class="mt-3 text-center">
                Already have an account?
                <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>
    </section>
{% endblock %}
