{% extends "layout.html" %}

{% block title %}
    Settings
{% endblock %}

{% block main %}
<section class="settings-page">
    <div class="settings-card">
        <h1>Settings</h1>
        <p class="text-muted">
            Manage your StudyLoop account preferences.
        </p>
        <form action="{{ url_for('settings') }}" method="post">
            <!-- Appearance -->
            <div class="mb-4">
                <h4>Appearance</h4>
                <label for="theme" class="form-label">
                    Theme
                </label>
                <select
                    id="theme"
                    name="theme"
                    class="form-select">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

            <hr>

            <!-- Notifications -->
            <div class="mb-4">
                <h4>Notifications</h4>
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="emailNotifications"
                        name="email_notifications"
                        checked>
                    <label
                        class="form-check-label"
                        for="emailNotifications">
                        Receive email notifications
                    </label>
                </div>
            </div>

            <hr>

            <!-- Privacy -->
            <div class="mb-4">
                <h4>Privacy</h4>
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="privateProfile"
                        name="private_profile">
                    <label
                        class="form-check-label"
                        for="privateProfile">
                        Make my profile private
                    </label>
                </div>
            </div>

            <hr>

            <div class="d-flex justify-content-end">
                <button
                    class="btn btn-primary"
                    type="submit">
                    Save Settings
                </button>
            </div>
        </form>
    </div>

    <div class="settings-card mt-5 border border-danger p-4 rounded">
        <h3 class="text-danger">
            Danger Zone
        </h3>
        <p>
            Deleting your account is permanent and cannot be undone.
        </p>
        <a
            href="#"
            class="btn btn-outline-danger">
            Delete Account
        </a>
    </div>
</section>
{% endblock %}
